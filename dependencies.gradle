// Libraries bundled into the separate NESQL-Exporter-<version>-deps.jar (see addon.gradle.kts).
configurations {
    depsImplementation
    depsRuntime
    implementation.extendsFrom(depsImplementation)
    runtimeOnly.extendsFrom(depsRuntime)
}

dependencies {
    compileOnly("com.google.auto.value:auto-value-annotations:$autoValueVersion")
    annotationProcessor("com.google.auto.value:auto-value:$autoValueVersion")

    depsImplementation("com.google.protobuf:protobuf-java:$protoBufferVersion")

    compileOnly("org.projectlombok:lombok:$lombokVersion")
    annotationProcessor("org.projectlombok:lombok:$lombokVersion")

    depsImplementation("org.springframework.data:spring-data-jpa:$springDataVersion")

    compileOnly("jakarta.persistence:jakarta.persistence-api:$jakartaPersistenceVersion")

    depsImplementation("org.hibernate:hibernate-core-jakarta:$hibernateVersion")
    annotationProcessor("org.hibernate:hibernate-jpamodelgen-jakarta:$hibernateVersion")

    depsRuntime("org.hsqldb:hsqldb:$hsqldbVersion:jdk8")
    depsRuntime("org.postgresql:postgresql:$postgresqlVersion")

    // Mods. NotEnoughItems is the only hard runtime dependency; the others are optional plugins.
    implementation("com.github.GTNewHorizons:NotEnoughItems:$neiVersion:dev")
    implementation("com.github.GTNewHorizons:Mobs-Info:$mobsInfoVersion:dev")
    implementation("com.github.GTNewHorizons:Avaritia:$avaritiaVersion:dev")
    implementation("com.github.GTNewHorizons:GT5-Unofficial:$gregTech5Version:dev") { transitive = true }
    compileOnly("net.industrial-craft:industrialcraft-2:$industrialCraft2Version-experimental:api") { transitive = true }
    compileOnly("com.github.GTNewHorizons:ForestryMC:$forestryVersion:api") { transitive = true }
    compileOnly("com.github.GTNewHorizons:Railcraft:$railcraftVersion:api") { transitive = true }
    compileOnly("com.github.GTNewHorizons:BuildCraft:$buildCraftVersion:api") { transitive = true }
    compileOnly("com.github.GTNewHorizons:EnderIO:$enderIoVersion:api") { transitive = true }
    compileOnly("com.github.GTNewHorizons:ProjectRed:$projectRedVersion:dev") { transitive = true }
    compileOnly("com.github.GTNewHorizons:ModularUI:$modularUiVersion") { transitive = true }

    implementation("thaumcraft:Thaumcraft:$minecraftVersion-$thaumcraftVersion:dev")
    implementation("com.github.GTNewHorizons:AspectRecipeIndex:$aspectRecipeIndexVersion:dev")

    implementation("com.github.GTNewHorizons:BetterQuesting:$betterQuestingVersion:dev")
}
