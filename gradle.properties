# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL to test local config updates.
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable mod name, available for mcmod.info population.
modName = Not Enough SQL Exporter

# Case-sensitive identifier string, available for mcmod.info population and used for automatic mixin JSON generation.
# Conventionally lowercase.
modId = nesql-exporter

# Root package of the mod, used to find various classes in other properties,
# mcmod.info substitution, enabling assertions in run tasks, etc.
modGroup = com.github.dcysteine.nesql

# Whether to use modGroup as the maven publishing group.
# When false, com.github.GTNewHorizons is used.
useModGroupForPublishing = true

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# Specify an MCP channel for dependency deobfuscation and the deobfParams task.
channel = stable

# Specify an MCP mappings version for dependency deobfuscation and the deobfParams task.
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Select a default username for testing your mod. You can always override this per-run by running
# `./gradlew runClient --username=AnotherPlayer`, or configuring this command in your IDE.
developmentEnvironmentUserName = Developer

# Enables modern Java syntax support. Valid values:
# - false: No modern syntax, Java 8 only
# - jabel: Jabel syntax-only support, compiles to J8 bytecode
# - jvmDowngrader: Full modern Java via JVM Downgrader (syntax + stdlib APIs)
# - modern: Native modern Java bytecode, no downgrading
enableModernJavaSyntax = jabel

# Enables injecting missing generics into the decompiled source code for a better coding experience.
# Turns most publicly visible List, Map, etc. into proper List<E>, Map<K, V> types.
enableGenericInjection = true

# Generate a class with a String field for the mod version named as defined below.
# If generateGradleTokenClass is empty or not missing, no such class will be generated.
# If gradleTokenVersion is empty or missing, the field will not be present in the class.
generateGradleTokenClass = com.github.dcysteine.nesql.Tags

# Name of the token containing the project's current version to generate/replace.
gradleTokenVersion = EXPORTER_VERSION

# [DEPRECATED]
replaceGradleTokenInFile =

# In case your mod provides an API for other mods to implement you may declare its package here. Otherwise, you can
# leave this property empty.
apiPackage =

# Specify the configuration file for Forge's access transformers here. It must be placed into /src/main/resources/META-INF/
accessTransformersFile =

# Provides setup for Mixins if enabled. If you don't know what mixins are: Keep it disabled!
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# The database and ORM libraries are packaged into a separate "deps" jar (see addon.gradle.kts), not shadowed,
# because Hibernate breaks under class relocation and minimization.
usesShadowedDependencies = false
minimizeShadowedDependencies = false
relocateShadowedDependencies = false

# Adds CurseMaven, Modrinth, and some more well-known 1.7.10 repositories.
includeWellKnownRepositories = true
excludeWellKnownRepositories =

# Releases are published as GitHub Releases only; no Maven, Modrinth or CurseForge publishing.
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeEnvironments = client
curseForgeRelations =

# Preserve the historical artifact naming (NESQL-Exporter-<version>.jar).
customArchiveBaseName = NESQL-Exporter

# Only allow release tags of the form x.y.z (optionally with a -pre/-snapshot suffix).
versionPattern = \\d+\\.\\d+\\.\\d+(-pre|-snapshot)?

# Non-GTNH properties
org.gradle.configuration-cache = true
org.gradle.parallel = true

# ---------------------------------------------------------------------------------------------------------------------
# Library versions (see dependencies.gradle.kts)
# ---------------------------------------------------------------------------------------------------------------------
autoValueVersion = 1.10.4
protoBufferVersion = 4.26.1
lombokVersion = 1.18.32

# Be careful if you want to update these versions. Later versions may require newer Java than 1.8
springDataVersion = 2.7.7
# 3.1.0 requires newer Java than 1.8
jakartaPersistenceVersion = 3.0.0
# Newer Hibernate requires newer Java than 1.8, or doesn't support Jakarta
hibernateVersion = 5.6.15.Final
hsqldbVersion = 2.7.2
postgresqlVersion = 42.7.3

# ---------------------------------------------------------------------------------------------------------------------
# Mod versions, matching the GTNH 2.9.0-RC-1 target pack
# ---------------------------------------------------------------------------------------------------------------------
neiVersion = 2.8.145-GTNH
gregTech5Version = 5.09.54.183
industrialCraft2Version = 2.2.828
forestryVersion = 4.11.38
railcraftVersion = 9.17.31
buildCraftVersion = 7.1.63
enderIoVersion = 2.10.46
projectRedVersion = 4.12.44-GTNH
mobsInfoVersion = 0.6.0-GTNH
avaritiaVersion = 1.99
modularUiVersion = 1.3.4
thaumcraftVersion = 4.2.3.5
aspectRecipeIndexVersion = 1.1.5
betterQuestingVersion = 3.8.87-GTNH
